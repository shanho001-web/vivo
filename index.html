<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新人開發者培訓中心</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="sidebar">
        <h2>🚀 培訓中心</h2>
        <ul>
            <li><button class="nav-btn active" onclick="showSection('module1')">1. 開發環境</button></li>
            <li><button class="nav-btn" onclick="showSection('module2')">2. 基礎教學</button></li>
            <li><button class="nav-btn" onclick="showSection('game')">3. JS 猜數字遊戲</button></li>
            <li><button class="nav-btn" onclick="showSection('ai')">4. AI 互動區</button></li>
        </ul>
    </nav>

    <main class="content">
        <section id="module1" class="section-block active-section">
            <h1>模組一：開發環境建置</h1>
            <p>1. 下載 VS Code。<br>2. 安裝 Live Server 擴充套件。<br>3. 建立專案資料夾。</p>
        </section>

        <section id="module2" class="section-block">
            <h1>模組二：JavaScript 基礎</h1>
            <p>變數：<code>let x = 10;</code><br>函式：<code>function sayHi() { alert("Hi!"); }</code></p>
        </section>

        <section id="game" class="section-block">
            <h1>JS 基礎挑戰遊戲：猜數字</h1>
            <div class="game-container">
                <input type="number" id="guess-input" placeholder="輸入 1-10">
                <button onclick="checkGuess()">猜猜看</button>
                <p id="game-result">準備好了嗎？</p>
            </div>
        </section>

        <section id="ai" class="section-block">
            <h1>AI 互動區</h1>
            <input type="text" id="ai-input" placeholder="問 AI 技術問題...">
            <button onclick="askAI()" id="ai-btn">送出</button>
            <div id="ai-response" style="margin-top:10px;"></div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
